<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Tell-Tale Heart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A Poe-themed investigation game for The Tell-Tale Heart. Students study vocabulary, learn how Poe builds suspense, decode the eye, the heartbeat, and the floorboards, then build a case about the narrator.">
<meta name="theme-color" content="#0c0908">
<meta property="og:type" content="website">
<meta property="og:title" content="The Tell-Tale Heart: An Investigation">
<meta property="og:description" content="Vocabulary, suspense, and symbolism in Poe’s story. Build your case: can the narrator be trusted?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230c0908'/%3E%3Cpath d='M12 20s-7-4.3-8.8-8.7C1.8 7.8 4 4.6 7.3 4.6c1.9 0 3.4 1 4.7 2.7 1.3-1.7 2.8-2.7 4.7-2.7 3.3 0 5.5 3.2 4.1 6.7C19 15.7 12 20 12 20z' fill='%23d23a2e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* Layout: one candle-lit chamber. A sticky bar carries the narrator's heart and the tools;
   below it a single centred column holds whichever "room" of the house the student is in. */
:root{
  color-scheme: dark;
  --night:#0c0908; --chamber:#15100e; --panel:#1c1512; --panel-hi:#271d18;
  --parchment:#ecdfc6; --ash:#ab9b8b; --line:rgba(236,223,198,.14);
  --blood:#a3231d; --blood-hi:#d23a2e; --lantern:#e3aa4c; --eye:#a3c4d2;
  --good:#93c178; --bad:#e85d50; --ink:#1a110d;
  --wood-a:#2c1e15; --wood-b:#23170f;
  --font-display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --font-title:"IM Fell English",Georgia,serif;
  --font-body:"Alegreya",Georgia,"Times New Roman",serif;
  --font-type:"Special Elite","Courier New",monospace;
  --dread:0; --beat:.83s; --r:5px;
  --mx:50vw; --my:50vh;
}
body[data-skin="lantern"]{--night:#120c06;--chamber:#1b1209;--panel:#23170c;--panel-hi:#2f2010;--blood:#b4511b;--blood-hi:#e57f2f;--lantern:#f4c461}
body[data-skin="paleeye"]{--night:#080b0d;--chamber:#0f1418;--panel:#141b20;--panel-hi:#1c262c;--blood:#3e6e85;--blood-hi:#6fa6bf;--lantern:#c4dde7}
body[data-skin="bloodmoon"]{--night:#0d0405;--chamber:#170708;--panel:#210a0b;--panel-hi:#2e0e10;--blood:#c3191a;--blood-hi:#ff4436;--lantern:#ffa070}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--night); color:var(--parchment);
  font-family:var(--font-body); font-size:18px; line-height:1.55;
  min-height:100vh; overflow-x:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 48px;
  transition:background-color .6s;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(227,170,76,.18)}
:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
b,strong{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- the house itself: floorboards, candlelight, dread ---------- */
.bg{position:fixed;inset:0;pointer-events:none;z-index:-1}
.bg-floor{
  background:
    repeating-linear-gradient(90deg, transparent 0 158px, rgba(0,0,0,.55) 158px 160px),
    repeating-linear-gradient(0deg, transparent 0 517px, rgba(0,0,0,.45) 517px 519px),
    linear-gradient(90deg, var(--wood-a), var(--wood-b) 50%, var(--wood-a));
  opacity:.32;
}
.bg-candle{background:radial-gradient(ellipse 70% 55% at 50% 18%, rgba(227,170,76,.13), transparent 70%);animation:flicker 5s infinite steps(1)}
.bg-vignette{background:radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(0,0,0,.88) 100%)}
.bg-dread{background:radial-gradient(ellipse at 50% 50%, transparent 30%, var(--blood) 140%);opacity:calc(var(--dread) * .9);animation:dreadpulse var(--beat) infinite}
@keyframes flicker{0%{opacity:1}12%{opacity:.82}14%{opacity:1}48%{opacity:.9}50%{opacity:1}77%{opacity:.78}79%{opacity:.95}}
@keyframes dreadpulse{0%,100%{transform:scale(1)}12%{transform:scale(1.025)}24%{transform:scale(1)}36%{transform:scale(1.012)}}
.lantern-cursor{position:fixed;inset:0;pointer-events:none;z-index:40;background:radial-gradient(circle 240px at var(--mx) var(--my), transparent 0, rgba(0,0,0,.5) 100%)}

/* ---------- top bar ---------- */
/* Desktop & tablet: [Home + title] [pulse, gold] ........ [tool tiles][Teacher].
   Phone: row 1 = Home + pulse + gold, row 2 = six equal tiles, each icon over a label. */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  display:flex; align-items:center; gap:10px;
  padding-block:10px; margin-bottom:8px;
  background:linear-gradient(var(--night) 80%, transparent);
}
.bar-left{display:flex;align-items:center;gap:12px;min-width:0}
.bar-title{font-family:var(--font-display);font-size:1.25rem;letter-spacing:.02em;white-space:nowrap}
.bar-title em{color:var(--blood-hi);font-style:normal}
.bar-status{display:flex;align-items:center;gap:8px}
.bar-tools{display:flex;align-items:stretch;gap:6px;margin-left:auto}
.tile{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-width:64px;min-height:54px;padding:6px 8px;
  background:rgba(0,0,0,.42);border:1px solid var(--line);border-radius:var(--r);color:var(--parchment);
  font-family:var(--font-type);font-size:.72rem;letter-spacing:.05em;line-height:1;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:border-color .2s,color .2s,background .2s;
}
.tile .ico svg{width:22px;height:22px;display:block}
.tile:active{background:rgba(227,170,76,.16)}
.home-tile{border-color:rgba(227,170,76,.45);color:var(--lantern)}
.teacher-tile{background:var(--parchment);color:var(--ink);border-color:var(--parchment);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.teacher-tile:active{background:var(--lantern)}
@media (hover:hover){
  .tile:hover{border-color:var(--lantern);color:var(--lantern);background:rgba(227,170,76,.08)}
  .teacher-tile:hover{background:var(--lantern);color:var(--ink)}
}
/* Hover labels (mouse and keyboard focus only; touch devices already show the text under each icon) */
@media (hover:hover){
  [data-tip]{position:relative}
  [data-tip]::after{
    content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;
    transform:translate(-50%,-4px);width:max-content;max-width:240px;white-space:normal;
    background:var(--parchment);color:var(--ink);font-family:var(--font-body);font-size:.88rem;font-weight:400;
    letter-spacing:0;line-height:1.35;text-align:left;padding:7px 11px;border-radius:4px;
    box-shadow:0 8px 24px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:70;
  }
  [data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}
  [data-tip-edge="left"]::after{left:0;transform:translate(0,-4px)}
  [data-tip-edge="left"]:hover::after,[data-tip-edge="left"]:focus-visible::after{transform:translate(0,0)}
  [data-tip-edge="right"]::after{left:auto;right:0;transform:translate(0,-4px)}
  [data-tip-edge="right"]:hover::after,[data-tip-edge="right"]:focus-visible::after{transform:translate(0,0)}
}
.heart-hud{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 6px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.35);font-family:var(--font-type);font-size:.9rem;font-variant-numeric:tabular-nums}
.heart-hud svg{width:26px;height:26px;color:var(--blood-hi);animation:beat var(--beat) infinite;filter:drop-shadow(0 0 calc(var(--dread)*10px) var(--blood-hi))}
.heart-hud .bpm-label{color:var(--ash);font-size:.75rem}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.12)}}
.gold-hud{display:flex;align-items:center;gap:6px;font-family:var(--font-type);font-size:.95rem;color:var(--lantern);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.gold-hud svg{width:18px;height:18px}
.gold-hud.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
@media (max-width:1060px){ .bar-title{display:none} }
@media (max-width:860px){ .heart-hud .bpm-label{display:none} .tile{min-width:56px;padding:6px 6px} }
@media (max-width:700px){
  .topbar{display:grid;grid-template-columns:auto 1fr;gap:8px}
  .bar-status{justify-self:end}
  .bar-tools{grid-column:1 / -1;margin-left:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
  .bar-tools .tile{min-width:0;min-height:50px;padding:6px 2px;font-size:.66rem;letter-spacing:.02em}
  .tile .ico svg{width:20px;height:20px}
  .home-tile{flex-direction:row;min-height:40px;padding:6px 12px;gap:8px;font-size:.78rem}
}
@media (max-width:360px){
  .bar-tools{gap:3px}
  .bar-tools .tile{font-size:.56rem;letter-spacing:0}
  .heart-hud,.gold-hud{padding-inline:8px}
}

/* ---------- shared pieces ---------- */
main{max-width:940px;margin:0 auto}
.room{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,36px);box-shadow:0 20px 60px rgba(0,0,0,.55);position:relative}
.kicker{font-family:var(--font-type);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lantern)}
.muted{color:var(--ash)}
.small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel-hi);color:var(--parchment);padding:11px 20px;border-radius:var(--r);font-weight:600;transition:transform .15s, background .2s, border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--lantern)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--blood);border-color:var(--blood-hi);color:#fff4ea}
.btn-primary:hover:not(:disabled){background:var(--blood-hi)}
.btn-link{background:none;border:0;color:var(--ash);padding:4px 0;font-size:.95rem}
.btn-link:hover{color:var(--lantern)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.epigraph{font-family:var(--font-title);font-style:italic;font-size:clamp(1.05rem,2.6vw,1.3rem);color:var(--parchment);opacity:.9;max-width:60ch}
.passage{
  position:relative; margin:0 0 18px; padding:16px 20px;
  font-family:var(--font-title); font-size:clamp(1.08rem,2.5vw,1.28rem); line-height:1.5;
  background:rgba(0,0,0,.32); border-left:3px solid var(--blood-hi); border-radius:0 var(--r) var(--r) 0;
  overflow:hidden;
}
.passage b{color:var(--lantern);font-weight:400;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--lantern);color:var(--lantern);text-align:center;font-style:normal}
.prompt{font-size:1.12rem;font-weight:700;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--parchment);transition:border-color .2s, background .2s, transform .15s}
.opt:hover:not(:disabled){border-color:var(--lantern);background:rgba(227,170,76,.07)}
.opt .key{flex:none;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-family:var(--font-type);font-size:.8rem;color:var(--ash)}
.opt.correct{border-color:var(--good);background:rgba(147,193,120,.13)}
.opt.correct .key{background:var(--good);color:var(--ink);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(232,93,80,.1);opacity:.75;animation:shake .4s}
.opt.wrong .key{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.opt.removed{opacity:.25;text-decoration:line-through}
.opt:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.feedback{margin-top:14px}
.fb{border-radius:var(--r);padding:12px 16px;border:1px solid var(--line);display:grid;gap:10px}
.fb.good{border-color:var(--good);background:rgba(147,193,120,.09)}
.fb.bad{border-color:var(--bad);background:rgba(232,93,80,.08)}
.fb-title{font-family:var(--font-display);font-size:1.2rem}
.fb.good .fb-title{color:var(--good)}
.fb.bad .fb-title{color:var(--bad)}
.mcq-foot{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mcq-foot .oil-btn{margin-left:auto}
.key-hint{font-family:var(--font-type);font-size:.78rem}
@media (hover:none){ .key-hint{display:none} }
.oil-btn{background:none;border:1px dashed var(--line);color:var(--ash);border-radius:var(--r);padding:5px 10px;font-size:.82rem}
.oil-btn:hover:not(:disabled){color:var(--lantern);border-color:var(--lantern)}
.oil-btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- title screen ---------- */
.listen-hint{display:flex;align-items:center;gap:8px;font-family:var(--font-type);font-size:.85rem;color:var(--lantern);opacity:.85;animation:hintPulse var(--beat) ease-in-out infinite;transition:opacity .6s}
.listen-hint svg{width:18px;height:18px}
.listen-hint.gone{opacity:0;animation:none}
@keyframes hintPulse{0%,100%{opacity:.55}20%{opacity:1}}
.title-screen{display:grid;justify-items:center;text-align:center;gap:18px;padding-top:clamp(10px,4vh,40px)}
.evil-eye{width:min(380px,82vw);height:auto;filter:drop-shadow(0 0 40px rgba(163,196,210,.18))}
.evil-eye .lid{transform-box:view-box}
.evil-eye .lid-top{animation:lidTop 7s infinite}
.evil-eye .lid-bot{animation:lidBot 7s infinite}
@keyframes lidTop{0%,90%,100%{transform:translateY(-84px)}94%{transform:translateY(0)}}
@keyframes lidBot{0%,90%,100%{transform:translateY(84px)}94%{transform:translateY(0)}}
.evil-eye .iris{transition:transform .25s ease-out}
.game-title{font-family:var(--font-display);font-size:clamp(2.6rem,9vw,5.2rem);letter-spacing:.01em;line-height:.95}
.game-title .the{display:block;font-size:.4em;letter-spacing:.3em;color:var(--ash)}
.game-title .heart-word{color:var(--blood-hi)}
.register{display:grid;gap:10px;width:min(440px,100%);background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:var(--r);text-align:left}
.register label{font-family:var(--font-type);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--lantern)}
.register input{background:rgba(0,0,0,.4);border:0;border-bottom:2px solid var(--ash);padding:10px 4px;font-family:var(--font-type);font-size:1.15rem}
.register input:focus{outline:none;border-bottom-color:var(--lantern)}

/* ---------- hub ---------- */
.hub-head{display:grid;gap:10px;margin-bottom:22px}
.hub-head h2{font-size:clamp(1.9rem,5vw,2.8rem)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.door{
  position:relative;display:grid;gap:10px;align-content:start;text-align:left;
  background:linear-gradient(180deg, var(--panel-hi), var(--panel));
  border:1px solid var(--line);border-radius:var(--r) var(--r) 2px 2px;padding:22px 20px 18px;
  color:var(--parchment);min-height:230px;transition:transform .2s, border-color .2s, box-shadow .2s;
}
.door:hover:not(.locked){transform:translateY(-4px);border-color:var(--lantern);box-shadow:0 14px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(227,170,76,.2)}
.door .door-icon{width:46px;height:46px;color:var(--lantern)}
.door .door-icon svg{width:100%;height:100%}
.door h3{font-size:1.6rem}
.door .act-no{font-family:var(--font-type);font-size:.78rem;letter-spacing:.14em;color:var(--ash);text-transform:uppercase}
.door .knob{position:absolute;right:16px;top:50%;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #f6d38c, #8a5d1d);box-shadow:0 0 8px rgba(227,170,76,.4)}
.door.locked{opacity:.55;cursor:not-allowed}
.door.done{border-color:rgba(147,193,120,.5)}
.pips{display:flex;gap:6px;margin-top:auto}
.pip{width:22px;height:6px;border-radius:3px;background:rgba(236,223,198,.15)}
.pip.on{background:var(--good)}
.hub-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.continue-btn{margin-top:16px}
.save-warn{margin-top:14px;border:1px solid var(--bad);border-radius:var(--r);padding:10px 12px;color:var(--parchment);background:rgba(232,93,80,.1);font-size:.92rem;max-width:62ch}
.review-box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;max-width:62ch;background:rgba(0,0,0,.2)}
.review-chips{display:flex;flex-wrap:wrap;gap:6px}
.review-chips span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;color:var(--parchment)}
.overall{display:flex;align-items:center;gap:12px;font-family:var(--font-type);font-size:.85rem;color:var(--ash)}
.bar{flex:1;height:8px;background:rgba(236,223,198,.12);border-radius:4px;overflow:hidden;min-width:120px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--blood),var(--lantern));border-radius:4px;transition:width .6s}

/* ---------- act page ---------- */
.act-head{display:grid;gap:12px;margin-bottom:22px}
.act-head h2{font-size:clamp(2rem,6vw,3rem)}
.stage-list{display:grid;gap:12px}
.stage-item{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:left;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--parchment)}
.stage-item:hover:not(:disabled){border-color:var(--lantern)}
.stage-item:disabled{opacity:.45;cursor:not-allowed}
.stage-item .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-family:var(--font-display);font-size:1.1rem}
.stage-item.done .num{background:var(--good);color:var(--ink);border-color:var(--good)}
.stage-item h3{font-size:1.25rem}
.stage-item .meta{font-family:var(--font-type);font-size:.8rem;color:var(--ash);white-space:nowrap}
.stars{color:var(--lantern);letter-spacing:2px}

/* ---------- stage frame ---------- */
.stage-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.stage-head .grow{flex:1;min-width:0}
.stage-head h2{font-size:clamp(1.5rem,4vw,2rem)}
.progress-text{font-family:var(--font-type);font-size:.85rem;color:var(--ash);font-variant-numeric:tabular-nums}
.progress-line{height:4px;background:rgba(236,223,198,.1);border-radius:2px;margin-bottom:20px;overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--blood-hi);transition:width .4s}
.section-banner{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.section-banner .ico{width:44px;height:44px;color:var(--lantern);flex:none}
.section-banner .ico svg{width:100%;height:100%}
.section-banner h3{font-size:1.5rem}

/* flip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.vcard{perspective:900px;background:none;border:0;padding:0;text-align:left;color:var(--parchment)}
.vc-inner{display:grid;transition:transform .55s;transform-style:preserve-3d;min-height:220px}
.vcard.flipped .vc-inner{transform:rotateY(180deg)}
.vc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;align-content:center;gap:8px}
.vc-front{background:linear-gradient(160deg,var(--panel-hi),rgba(0,0,0,.4));justify-items:center;text-align:center}
.vc-front .w{font-family:var(--font-title);font-size:1.6rem}
.vc-front .pos{font-family:var(--font-type);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.vcard.seen .vc-front{border-color:rgba(147,193,120,.5)}
.vc-back{transform:rotateY(180deg);background:#efe2c8;color:var(--ink);align-content:start;font-size:.92rem;line-height:1.4}
.vc-back .def{font-weight:700;font-size:1rem}
.vc-back .q{font-family:var(--font-title);font-style:italic}
.vc-back .q b{color:#8a1c16;font-style:normal}
.vc-back .ex{font-size:.85rem;opacity:.8}

/* lantern round */
.lantern-passage{min-height:150px;display:flex;align-items:center;touch-action:pan-y}
.darkness{position:absolute;inset:0;background:#030202;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle 95px at var(--lx,50%) var(--ly,50%), transparent 0, transparent 55%, #000 100%);
  mask-image:radial-gradient(circle 95px at var(--lx,50%) var(--ly,50%), transparent 0, transparent 55%, #000 100%);
  transition:opacity .6s}
.lit .darkness{opacity:0}
.lantern-hint{font-size:.88rem;color:var(--ash);margin:-6px 0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn-lantern{background:rgba(227,170,76,.14);border-color:var(--lantern);color:var(--lantern);padding:8px 14px}
.btn-lantern svg{width:18px;height:18px}
.btn-lantern:hover:not(:disabled){background:rgba(227,170,76,.24)}
.clue-row{display:grid;gap:8px;justify-items:start;margin:-4px 0 14px}
.btn-clue{background:rgba(163,196,210,.1);border-color:var(--eye);color:var(--eye);padding:8px 14px}
.btn-clue svg{width:18px;height:18px}
.btn-clue:hover:not(:disabled){background:rgba(163,196,210,.2)}
.clue-text{border:1px dashed var(--eye);border-radius:var(--r);padding:10px 14px;background:rgba(163,196,210,.06)}
.clue-text strong{color:var(--eye)}

/* break between rounds */
.intermission{display:grid;gap:14px;justify-items:start;padding-block:6px}
.intermission .big-score{font-family:var(--font-display);font-size:3rem;line-height:1}
.round-dots{display:flex;gap:8px;align-items:center;font-family:var(--font-type);font-size:.8rem;color:var(--ash)}
.round-dots i{width:34px;height:8px;border-radius:4px;background:rgba(236,223,198,.15)}
.round-dots i.on{background:var(--good)}

/* match */
.match-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.beetle-timer{display:flex;align-items:center;gap:8px;font-family:var(--font-type);font-variant-numeric:tabular-nums}
.beetle-timer svg{width:28px;height:28px;color:var(--ash)}
.beetle-timer.ticking svg{animation:tick 1s steps(2) infinite}
@keyframes tick{50%{transform:rotate(8deg)}}
.match-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.match-col{display:grid;gap:8px;align-content:start}
.mitem{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;color:var(--parchment);min-height:48px}
.mitem.word{font-family:var(--font-title);font-size:1.15rem}
.mitem.def{font-size:.92rem;line-height:1.3}
.mitem.sel{border-color:var(--lantern);background:rgba(227,170,76,.12)}
.mitem.matched{border-color:var(--good);opacity:.35;cursor:default}
.mitem.nope{animation:shake .4s;border-color:var(--bad)}

/* toolkit */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.tcard{text-align:left;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--parchment);display:grid;gap:8px;align-content:start}
.tcard h3{font-size:1.3rem;display:flex;justify-content:space-between;gap:8px}
.tcard .tbody{display:none;gap:8px}
.tcard.open{border-color:var(--lantern)}
.tcard.open .tbody{display:grid}
.tcard .ex{font-family:var(--font-title);font-style:italic;border-left:2px solid var(--blood-hi);padding-left:10px}
.tcard .seen-dot{width:10px;height:10px;border-radius:50%;background:rgba(236,223,198,.2);flex:none;margin-top:8px}
.tcard.seen .seen-dot{background:var(--good)}

/* clock */
.clock-wrap{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.clock{width:84px;height:84px;flex:none}
.clock .face{fill:#efe2c8}
.clock .mark{stroke:#5b4636;stroke-width:2}
.clock .mark.lit{stroke:var(--blood);stroke-width:4}
.clock .hand{stroke:var(--ink);stroke-width:3;stroke-linecap:round;transition:transform .8s cubic-bezier(.5,1.6,.5,1);transform-origin:60px 60px}
.clock-text{font-family:var(--font-type);font-size:.85rem;color:var(--ash)}
.clock-text strong{display:block;font-family:var(--font-display);font-weight:400;font-size:1.3rem;color:var(--parchment)}

/* dial */
.dial-list{display:grid;gap:10px}
.dial-item{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:var(--r);padding:12px;color:var(--parchment);font-family:var(--font-title);font-size:1.05rem}
.dial-item .slot{width:40px;height:40px;border-radius:50%;border:1px dashed var(--ash);display:grid;place-items:center;font-family:var(--font-display);font-size:1.2rem}
.dial-item.set .slot{border-style:solid;background:var(--blood);border-color:var(--blood-hi);color:#fff}
.dial-item.ok{border-color:var(--good)}
.dial-item.no{border-color:var(--bad)}
.dial-scale{display:flex;justify-content:space-between;font-family:var(--font-type);font-size:.78rem;color:var(--ash);margin:4px 0 10px}
.dial-scale span:last-child{color:var(--blood-hi)}

/* planks */
.sym-tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:8px;margin-bottom:16px}
.sym-slot{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:.88rem}
.sym-slot svg{width:22px;height:22px;color:var(--lantern);flex:none}
.sym-slot b{margin-left:auto;font-family:var(--font-type);font-weight:400;font-variant-numeric:tabular-nums;color:var(--ash)}
.sym-slot.full{border-color:var(--good)}
.sym-slot.full b{color:var(--good)}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:6px;padding:10px;background:#0a0605;border-radius:var(--r);animation:floorbeat var(--beat) infinite}
@keyframes floorbeat{0%,100%{box-shadow:inset 0 0 0 rgba(210,58,46,0)}12%{box-shadow:inset 0 0 calc(10px + var(--dread)*40px) rgba(210,58,46,.35)}}
.plank{
  position:relative;height:74px;border:0;border-radius:2px;color:var(--parchment);
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.0) 0 18px, rgba(0,0,0,.12) 18px 19px),
    linear-gradient(180deg,#5a3d29,#3f2a1b 60%,#33221a);
  box-shadow:inset 0 2px 0 rgba(255,220,180,.12), inset 0 -3px 0 rgba(0,0,0,.4);
  font-family:var(--font-type);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;
  transition:transform .3s;
}
.plank:hover:not(:disabled){transform:translateY(-3px) rotate(-.6deg)}
.plank .nail{position:absolute;top:50%;width:7px;height:7px;margin-top:-3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#bbb,#444)}
.plank .nail.l{left:10px}.plank .nail.r{right:10px}
.plank.active{outline:2px solid var(--lantern);transform:translateY(-6px) rotate(-1.4deg)}
.plank.solved{background:linear-gradient(180deg,#130c09,#070403);box-shadow:inset 0 0 18px #000;cursor:default}
.plank.solved .plank-label{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--good)}
.plank.solved svg{width:20px;height:20px}
.plank.solved .nail{display:none}
.clue-panel{margin-top:16px}
.sym-choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:8px}
.sym-choice{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:var(--r);padding:10px;color:var(--parchment);text-align:left}
.sym-choice svg{width:22px;height:22px;color:var(--lantern);flex:none}
.sym-choice:hover:not(:disabled){border-color:var(--lantern)}
.sym-choice.wrong{border-color:var(--bad);opacity:.5}

/* finale & case file */
.choice-list{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--parchment)}
.choice[aria-pressed="true"]{border-color:var(--lantern);background:rgba(227,170,76,.1)}
.choice .box{flex:none;width:22px;height:22px;border:1px solid var(--ash);border-radius:4px;display:grid;place-items:center;margin-top:3px}
.choice[aria-pressed="true"] .box{background:var(--lantern);border-color:var(--lantern);color:var(--ink)}
.choice .q{font-family:var(--font-title);font-style:italic}
.choice .tag{display:block;font-family:var(--font-type);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);margin-top:4px;font-style:normal}
textarea.claim{width:100%;min-height:180px;background:#efe2c8;color:var(--ink);border:0;border-radius:var(--r);padding:16px;font-family:var(--font-type);font-size:1rem;line-height:1.6;resize:vertical}
.casefile{background:#e9dcc0;color:var(--ink);border-radius:3px;padding:clamp(20px,5vw,44px);position:relative;font-family:var(--font-type);box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.casefile h2{font-family:var(--font-display);font-size:clamp(1.8rem,5vw,2.6rem);color:#5a1410}
.casefile .cf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin:18px 0;padding:14px 0;border-block:1px dashed #8a7356}
.casefile .cf-label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#7a654a}
.casefile .cf-ev{font-family:var(--font-title);font-style:italic;font-size:1.05rem;border-left:3px solid #8a1c16;padding-left:12px;margin:8px 0}
.casefile .cf-claim{white-space:pre-wrap;line-height:1.7;font-size:1rem}
.stamp{position:absolute;right:clamp(10px,4vw,40px);top:clamp(14px,4vw,34px);border:4px double #a3231d;color:#a3231d;padding:6px 14px;font-family:var(--font-type);font-size:clamp(1rem,3vw,1.5rem);letter-spacing:.15em;transform:rotate(-12deg);opacity:.85}

/* ---------- modals, toasts, confession ---------- */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(760px,100%);max-height:88vh;max-height:88dvh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overflow:auto;background:var(--chamber);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,30px);box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal-head h2{flex:1;font-size:1.9rem}
.x{background:none;border:1px solid var(--line);color:var(--parchment);width:36px;height:36px;border-radius:50%;font-size:1.2rem;line-height:1}
.modal.paper{background:#ece0c7;color:var(--ink);border-color:#b9a27e}
.modal.paper .x{color:var(--ink);border-color:#9a8566}
.modal.paper .muted{color:#6a5a48}
.modal.paper .kicker{color:#8a1c16}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;display:grid;gap:8px;width:min(420px,calc(100% - 32px))}
.toast{background:var(--chamber);border:1px solid var(--lantern);border-radius:var(--r);padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;gap:10px;align-items:center;animation:toastIn .35s ease-out}
.toast svg{width:22px;height:22px;color:var(--lantern);flex:none}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}}
.confession{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:radial-gradient(ellipse at center, rgba(120,10,8,.92), rgba(5,0,0,.97));padding:24px;text-align:center}
.confession .inner{max-width:640px;display:grid;gap:18px;justify-items:center}
.confession blockquote{margin:0;font-family:var(--font-title);font-style:italic;font-size:clamp(1.3rem,4vw,2rem);line-height:1.35;color:#fff2e6;animation:tremble .12s infinite}
@keyframes tremble{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
.confession .big-heart{width:110px;height:110px;color:#ff3b30;animation:beat .33s infinite}

/* shop & awards */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.item{display:grid;gap:8px;align-content:start;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.item h3{font-size:1.2rem}
.item .swatch{height:36px;border-radius:3px;border:1px solid var(--line)}
.item .price{font-family:var(--font-type);color:var(--lantern);font-size:.9rem}
.item .btn{padding:8px 12px;font-size:.9rem}
.award{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:rgba(0,0,0,.25)}
.award svg{width:30px;height:30px;flex:none;color:var(--ash)}
.award.got{border-color:var(--lantern)}
.award.got svg{color:var(--lantern)}
.award h3{font-size:1.15rem}
.list-gap{display:grid;gap:10px}

/* teacher report */
.tr-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin:14px 0}
.tr-stat{border:1px solid #b9a27e;border-radius:4px;padding:10px 12px;background:rgba(255,255,255,.3)}
.tr-stat .n{font-family:var(--font-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tr-stat .l{font-family:var(--font-type);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#6a5a48}
.tr-table-wrap{overflow-x:auto}
.tr-table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:520px}
.tr-table th,.tr-table td{text-align:left;padding:8px 8px;border-bottom:1px solid #c7b38f;vertical-align:top}
.tr-table th{font-family:var(--font-type);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#6a5a48;font-weight:400}
.tr-table td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-family:var(--font-type);font-size:.75rem;border:1px solid currentColor;margin:2px 4px 2px 0}
.chip.ok{color:#2f6b28}.chip.mid{color:#8a5a00}.chip.low{color:#a3231d}.chip.none{color:#7a6a58}
.tr-sec{margin-top:18px}
.tr-sec h3{font-size:1.3rem;margin-bottom:8px}
.tr-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.tr-actions .btn{background:#2a1d17;color:#f3e7d0;border-color:#2a1d17}
.tr-actions .btn.danger{background:#a3231d;border-color:#a3231d}
.tr-copy{width:100%;min-height:120px;margin-top:10px;font-family:var(--font-type);font-size:.85rem}

/* companions */
.companion{position:fixed;z-index:45;pointer-events:none;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:76px;height:76px}
.companion svg{width:100%;height:100%}
.companion.raven svg{animation:bob 4s ease-in-out infinite}
.companion.cat .tail{animation:swish 3s ease-in-out infinite;transform-origin:62px 62px}
.companion.beetle{width:44px;height:44px;animation:crawl 26s linear infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes swish{50%{transform:rotate(18deg)}}
@keyframes crawl{0%{transform:translateX(0)}50%{transform:translateX(calc(100vw - 90px))}50.01%{transform:translateX(calc(100vw - 90px)) scaleX(-1)}100%{transform:translateX(0) scaleX(-1)}}

.fade-in{animation:fadeIn .45s ease-out}
@keyframes fadeIn{from{opacity:.001;transform:translateY(8px)}}

/* ---------- polish: atmosphere & motion ---------- */
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
#flash{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0;background:radial-gradient(ellipse at center, transparent 35%, rgba(210,40,30,.5))}
#flash.on{animation:flashOut .55s ease-out}
@keyframes flashOut{from{opacity:1}to{opacity:0}}

/* title: the eye wakes, then the title bleeds in like ink */
.title-screen > *{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
.title-screen > .evil-eye{animation:eyeIn 1.2s ease-out backwards}
.title-screen > .game-title{animation:inkIn 1.5s ease-out .9s backwards}
.title-screen > :nth-child(3){animation-delay:1.6s}
.title-screen > :nth-child(4){animation-delay:1.9s}
.title-screen > :nth-child(5){animation-delay:2.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes eyeIn{from{opacity:0;transform:scale(.9)}}
@keyframes inkIn{from{opacity:0;filter:blur(10px);letter-spacing:.12em}}
@keyframes inkSoft{from{opacity:0;filter:blur(4px)}}
.title-eye .lid-top{animation:wakeTop 1.8s cubic-bezier(.6,0,.3,1) .3s backwards, lidTop 7s 3s infinite}
.title-eye .lid-bot{animation:wakeBot 1.8s cubic-bezier(.6,0,.3,1) .3s backwards, lidBot 7s 3s infinite}
@keyframes wakeTop{0%,25%{transform:translateY(0)}45%{transform:translateY(-34px)}58%{transform:translateY(-12px)}100%{transform:translateY(-84px)}}
@keyframes wakeBot{0%,25%{transform:translateY(0)}45%{transform:translateY(34px)}58%{transform:translateY(12px)}100%{transform:translateY(84px)}}

/* heartbeat trace beside the heart */
.ecg{width:64px;height:24px;display:block}
@media (max-width:860px){ .ecg{display:none} }

/* hub: the eye watches; doors arrive, then swing open */
.hub-head{grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:28px}
.hub-text{display:grid;gap:10px;min-width:0}
.hub-eye .evil-eye{width:150px;filter:drop-shadow(0 0 30px rgba(163,196,210,.15))}
@media (max-width:700px){ .hub-head{grid-template-columns:1fr} .hub-eye{display:none} }
.doors{perspective:1400px}
.door{transform-origin:left center;animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards}
.door:nth-child(2){animation-delay:.08s}.door:nth-child(3){animation-delay:.16s}.door:nth-child(4){animation-delay:.24s}
.door.opening{animation:doorOpen .42s cubic-bezier(.5,0,.75,.4) forwards;pointer-events:none}
@keyframes doorOpen{to{transform:rotateY(-72deg);opacity:.15;box-shadow:30px 0 60px rgba(0,0,0,.8)}}
.door .door-icon svg{transform-box:fill-box}
.door[data-act="vocab"] .door-icon svg{animation:write 2.8s ease-in-out infinite;transform-origin:15% 90%}
@keyframes write{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) translateX(2px)}50%{transform:rotate(4deg)}75%{transform:rotate(-5deg) translateX(-1px)}}
.door[data-act="suspense"] .door-icon svg{animation:swing 2.2s ease-in-out infinite;transform-origin:50% 0}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.door[data-act="symbols"] .door-icon svg{animation:beat var(--beat) infinite}
.door[data-act="finale"]:not(.locked) .door-icon svg{animation:sealGlow 2.4s ease-in-out infinite}
@keyframes sealGlow{50%{filter:drop-shadow(0 0 8px var(--lantern))}}

/* act header watermark */
.act-head{position:relative}
.act-mark{position:absolute;right:-6px;top:-18px;width:clamp(90px,20vw,170px);color:var(--lantern);opacity:.09;pointer-events:none}
.act-mark svg{width:100%;height:auto;display:block}

/* questions: passages bleed in, answers rise one after another */
.passage{animation:inkSoft .7s ease-out backwards}
.opts .opt:not(.wrong):not(.correct){animation:rise .4s ease-out backwards}
.opts .opt:nth-child(2){animation-delay:.06s}.opts .opt:nth-child(3){animation-delay:.12s}.opts .opt:nth-child(4){animation-delay:.18s}
.opts .opt.correct{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.03)}}
.fb{animation:rise .35s ease-out backwards}
.fb.good{box-shadow:0 0 0 1px rgba(147,193,120,.15), 0 0 28px rgba(147,193,120,.12)}

/* lantern light is warm, not just a hole in the dark */
.lantern-passage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 120px at var(--lx,50%) var(--ly,50%), rgba(227,170,76,.2), transparent 70%);transition:opacity .6s}
.lit.lantern-passage::before{opacity:0}

/* coins fly to the purse */
.fly-coin{position:fixed;left:0;top:0;z-index:130;width:22px;height:22px;color:var(--lantern);pointer-events:none;filter:drop-shadow(0 0 6px rgba(227,170,76,.8))}
.fly-coin svg{width:100%;height:100%;display:block}

/* primary buttons catch the candlelight */
.btn-primary{background:linear-gradient(180deg,var(--blood-hi),var(--blood));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.35);position:relative;overflow:hidden}
.btn-primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,240,220,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s;pointer-events:none}
@media (hover:hover){ .btn-primary:hover:not(:disabled)::after{transform:translateX(120%)} }

/* score screens */
.big-score{font-family:var(--font-display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.star-pop span{display:inline-block;animation:starPop .55s cubic-bezier(.3,1.7,.5,1) backwards}
@keyframes starPop{from{opacity:0;transform:scale(0) rotate(-40deg)}}

/* break screen candle */
.candle{width:46px;height:80px;display:block}
.candle .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame 1.3s ease-in-out infinite alternate}
.candle .flame.inner{animation-duration:.9s}
.candle .glow{animation:flicker 3s infinite steps(1)}
@keyframes flame{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.9,1.1) rotate(2deg)}100%{transform:scale(1.05,.94) rotate(-1deg)}}

/* planks lift when chosen; solved gaps glow with the heartbeat */
.plank.active{animation:liftUp .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes liftUp{from{transform:none}}
.plank.solved{animation:gapBeat var(--beat) infinite}
@keyframes gapBeat{0%,100%{box-shadow:inset 0 0 18px #000}12%{box-shadow:inset 0 0 18px #000, inset 0 0 16px rgba(210,58,46,.4)}}
.plank.solved.just .plank-label{animation:reveal .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes reveal{from{opacity:0;transform:scale(.4)}}

/* toasts on parchment */
.toast{background:var(--parchment);color:var(--ink);border-color:#b9a27e}
.toast svg{color:#8a1c16}
.toast .muted{color:#6a5a48}

/* confession: the pulse fills the room */
.confession{animation:fadeIn .25s ease-out}
.confession .inner{position:relative}
.confession .rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.confession .rings i{position:absolute;width:120px;height:120px;border:2px solid rgba(255,90,70,.55);border-radius:50%;animation:ring 1s ease-out infinite}
.confession .rings i:nth-child(2){animation-delay:.33s}.confession .rings i:nth-child(3){animation-delay:.66s}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(6);opacity:0}}

/* ---------- touch screens, small screens ---------- */
@media (hover:none){
  /* a tapped card shouldn't stay lifted after the finger leaves on phones and tablets */
  .btn:hover:not(:disabled),.door:hover:not(.locked),.plank:hover:not(:disabled){transform:none}
  .door:hover:not(.locked){box-shadow:none}
  .opt:hover:not(:disabled){border-color:var(--line);background:rgba(0,0,0,.25)}
  .opt:active:not(:disabled),.door:active:not(.locked),.choice:active,.mitem:active{border-color:var(--lantern)}
  .btn:active:not(:disabled){transform:scale(.97)}
}
@media (max-width:520px){
  body{font-size:17px}
  .room{padding:18px 14px}
  .stamp{position:static;display:inline-block;margin-bottom:12px;transform:rotate(-4deg)}
  .mitem.word{font-size:1rem}
  .mitem{padding:9px 8px;overflow-wrap:anywhere}
  .match-grid{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:6px}
  .stage-item{grid-template-columns:auto 1fr;gap:12px}
  .stage-item .meta{grid-column:2}
  .passage{padding:14px 14px}
  .opt{padding:12px 10px}
}
/* short landscape phones: let the toolbar scroll away so the question has room */
@media (max-height:500px) and (orientation:landscape){
  .topbar{position:static}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  body{background:#fff;color:#000;padding:0}
  body > *:not(#print-root){display:none!important}
  #print-root{display:block!important}
  .bg,.topbar{display:none!important}
}
#print-root{display:none}
</style>
</head>

const DETECT = [
  {id:'det-profound', label:'profound (in context)',
   passage:'So you see he would have been a very <b>profound</b> old man, indeed, to suspect that every night, just at twelve, I looked in upon him while he slept.',

    {t:'Because the old man really did suspect him.', why:'Close, but he says the old man would have to be very profound <i>to</i> suspect, meaning he believes the old man didn’t.'},
    {t:'Because he respects the old man’s deep religious faith.', why:'Nothing in this sentence is about religion. Look at what the old man would have to “suspect.”'}], answer:0},
  {id:'det-acute', label:'acute (in context)',

    {t:'He is telling the complete truth about everything.', why:'A person who hears “all things in the heaven and in the earth” is not a reliable witness.'}], answer:0},
  {id:'det-vex', label:'vexed (in context)',
   passage:'…for it was not the old man who <b>vexed</b> me, but his Evil Eye.',
   prompt:'What does this distinction reveal about the narrator?',
   options:[
    {t:'He separates the man from his eye, which is irrational. He will kill a man he says he loves because of one feature.', why:'Exactly. Splitting the eye from the person shows how twisted his reasoning is.'},
    {t:'The old man had been cruel to him for years.', why:'He says, “He had never wronged me. He had never given me insult.”'},
    {t:'He wants the old man’s money.', why:'He says, “For his gold I had no desire.”'},
    {t:'He wants to help cure the old man’s eye disease.', why:'His plan is to “rid myself of the eye forever,” not to cure it.'}], answer:0},
  {id:'det-suavity', label:'suavity vs. gesticulations',

   options:[
    {t:'The calm officers make his growing panic stand out. His mask of control is slipping.', why:'Yes. Poe sets smooth, polite officers beside a man flailing his arms. The contrast makes the narrator’s breakdown obvious.'},
    {t:'The officers are angry and he is calming them down.', why:'Reverse that. The officers stay calm; he is the one losing control.'},
    {t:'They are all dancing together.', why:'“Gesticulations” are dramatic gestures made while arguing, not dance moves.'},

const TOOLS = [
  {name:'Pacing', def:'How fast or slow the story feels. Short, choppy sentences speed it up; long, winding sentences slow it down.', ex:'He shrieked once—once only.'},
  {name:'Repetition', def:'Repeating words or phrases to build pressure, like a drumbeat that won’t stop.', ex:'louder! louder! louder! louder!'},
  {name:'Foreshadowing', def:'Hints or clues about what will happen later.', ex:'Death, in approaching him had stalked with his black shadow before him.'},

  {name:'Punctuation', def:'Dashes and exclamation points show panic and thoughts breaking apart.', ex:'They heard!—they suspected!—they knew!'}

  {id:'ch-1', label:'Unreliable narrator',

    {t:'Repetition (“quicker and quicker, and louder and louder”) copies a pounding heartbeat and rising panic.', why:'Exactly. A “tattoo” is a drumbeat, and the sentences pound like one.'},

  {id:'ch-10', label:'Dramatic irony',
   passage:'When I had made an end of these labors, it was four o’clock—still dark as midnight. As the bell sounded the hour, there came a knocking at the street door. I went down to open it with a light heart,—for what had I now to fear?',

   options:[
    {t:'He feels safe, but the knock means danger. A heart is exactly what will betray him.', why:'Yes. Poe slips the word “heart” in at the moment the narrator feels most secure.'},

    {t:'It means he is physically ill.', why:'“Light heart” is an expression for feeling cheerful and carefree.'},

  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = icon(ico) + `<div>${html}</div>`;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3800);
}
function unlock(id) {
  if (S.achievements.includes(id)) return;
  S.achievements.push(id); save();
  toast(`<strong>Award: ${ACHIEVEMENTS[id].name}</strong><br><span class="small muted">+5 gold</span>`, 'trophy');
  addGold(5);
}
function fileEvidence(id, quote, label) {
  if (!quote || S.evidence.some(e => e.id === id)) return;
  S.evidence.push({id, quote: quote.replace(/<[^>]+>/g, ''), label}); save();
  toast('<strong>Evidence filed.</strong> <span class="small muted">Added to your Evidence Locker.</span>', 'scroll');
}

/* =========================================================
   RESULTS (what the teacher report reads)
   ========================================================= */
function flyCoin(from) {
  if (RM || !from || !from.isConnected) return;
  const a = from.getBoundingClientRect(), t = $('#goldHud').getBoundingClientRect();
  const d = document.createElement('div'); d.className = 'fly-coin'; d.innerHTML = icon('coin');
  document.body.appendChild(d);
  const x0 = a.left + a.width / 2 - 11, y0 = a.top + a.height / 2 - 11, x1 = t.left + 10, y1 = t.top + t.height / 2 - 11;
  d.animate([
    {transform:`translate(${x0}px,${y0}px) scale(.5)`, opacity:0},
    {transform:`translate(${x0}px,${y0 - 46}px) scale(1.25)`, opacity:1, offset:.25},
    {transform:`translate(${x1}px,${y1}px) scale(.8)`, opacity:1}
  ], {duration:800, easing:'cubic-bezier(.5,0,.3,1)'}).onfinish = () => d.remove();
  setTimeout(() => d.remove(), 1500);
}
function hurt() {
  const f = $('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  if (!RM) main.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(4px)'},{transform:'translateX(-2px)'},{transform:'translateX(0)'}], {duration:280});
}
function record(id, act, label, firstOk, fromEl) {
  const r = S.results[id] || {attempts:0, everRight:false};
  r.attempts++; r.first = firstOk; r.act = act; r.label = label; r.at = Date.now();
  if (firstOk) r.everRight = true;
  S.results[id] = r;
  if (firstOk && !S.paid[id]) { S.paid[id] = 1; flyCoin(fromEl); setTimeout(() => addGold(1), RM ? 0 : 700); }
  save();
}

/* =========================================================
   MULTIPLE-CHOICE QUESTION
   ========================================================= */
let activeMcq = null;
function mcq(host, q, act, onNext) {
  const opts = shuffle(q.options.map((o, i) => ({...o, ok: i === q.answer})));
  let first = true, done = false;
  const shownAt = performance.now();
  const passageHtml = q.passage ? `<blockquote class="passage ${q.lantern ? 'lantern-passage' : ''}"><span class="ptext">${q.passage}</span>${q.lantern ? '<span class="darkness"></span>' : ''}</blockquote>` : '';
  host.innerHTML = `<div class="fade-in">${q.banner || ''}${passageHtml}
    ${q.lantern ? `<div class="lantern-hint"><button class="btn btn-lantern" data-light>${icon('lantern')} Light the whole passage</button><span>Or move your pointer or finger across the dark to read by lantern light.</span></div>` : ''}
    <p class="prompt">${q.prompt}</p>
    ${q.clueDef ? `<div class="clue-row"><button class="btn btn-clue" data-clue>${icon('book')} Clue: what does the missing word mean?</button><p class="clue-text" hidden>The missing word is ${/^[aeiou]/.test(q.cluePos) ? 'an' : 'a'} ${q.cluePos} that means <strong>${q.clueDef}</strong>.</p></div>` : ''}
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="key">${'ABCD'[i]}</span><span>${o.t}</span></button>`).join('')}</div>
    <div class="mcq-foot"><span class="key-hint small muted">Keys 1–4 or A–D answer.</span><button class="oil-btn" data-oil ${S.items.oil ? '' : 'disabled'}>Use lantern oil (${S.items.oil} left): remove a wrong answer</button></div>
    <div class="feedback" aria-live="polite"></div></div>`;
  const fb = $('.feedback', host), btns = $$('.opt', host);

  if (q.lantern) setupLantern($('.lantern-passage', host), $('[data-light]', host));
  const clueBtn = $('[data-clue]', host);
  if (clueBtn) clueBtn.onclick = () => {
    $('.clue-text', host).hidden = false;
    clueBtn.disabled = true; clueBtn.innerHTML = icon('book') + ' Clue revealed';
    S.cluesUsed = (S.cluesUsed || 0) + 1; save(); Sound.click();
  };

  function choose(i) {
    if (done || !host.isConnected) return;
    /* a double-click on the previous Continue button must not answer this question */
    if (performance.now() - shownAt < 450) return;
    const o = opts[i], b = btns[i];
    if (b.disabled) return;
    if (o.ok) {
      done = true; b.classList.add('correct'); $('.key', b).textContent = '✓';
      btns.forEach(x => x.disabled = true);
      if (first) { record(q.id, act, q.label, true, b); heartRight(); }
      Sound.good();
      if (q.onCorrect) q.onCorrect(host);
      fb.innerHTML = `<div class="fb good"><div class="fb-title">${first ? 'Correct.' : 'There it is.'}</div><div>${o.why}</div>
        <div><button class="btn btn-primary" data-next>${q.nextLabel || 'Continue'} →</button></div></div>`;
      $('[data-next]', fb).onclick = () => { activeMcq = null; onNext(first); };
      $('[data-next]', fb).focus({preventScroll:true});
      if (q.evidence !== false) fileEvidence(q.id, q.evidence || q.passage, q.label);
    } else {
      b.classList.add('wrong'); b.disabled = true; $('.key', b).textContent = '✕';
      if (first) { record(q.id, act, q.label, false); first = false; }
      heartWrong(); Sound.bad();
      fb.innerHTML = `<div class="fb bad"><div class="fb-title">Not quite.</div><div>${o.why}</div><div class="small muted">Try another answer.</div></div>`;
    }
  }
  btns.forEach((b, i) => b.onclick = () => choose(i));
  $('[data-oil]', host).onclick = e => {
    if (!S.items.oil || done) return;
    const wrongs = btns.filter((b, i) => !opts[i].ok && !b.disabled);
    if (wrongs.length <= 1) { toast('Only one wrong answer is left. Trust your reading!', 'lantern'); return; }
    const pick = wrongs[Math.floor(Math.random() * wrongs.length)];
    pick.disabled = true; pick.classList.add('removed');
    S.items.oil--; S.hintsUsed++; save();
    e.currentTarget.textContent = `Use lantern oil (${S.items.oil} left): remove a wrong answer`;
    if (!S.items.oil) e.currentTarget.disabled = true;
    Sound.click();
  };
  activeMcq = {choose, count: opts.length, host};
}
document.addEventListener('keydown', e => {
  if (!activeMcq || !activeMcq.host.isConnected || (e.target instanceof Element && e.target.matches('input, textarea')) || e.metaKey || e.ctrlKey || e.altKey || $('.modal-back') || $('.confession')) return;
  const k = e.key.toLowerCase(); const map = {'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3};
  if (k in map && map[k] < activeMcq.count) { e.preventDefault(); activeMcq.choose(map[k]); }
});

function setupLantern(box, lightBtn) {
  let auto = true, t0 = performance.now(), raf;
  const set = (x, y) => { box.style.setProperty('--lx', x + 'px'); box.style.setProperty('--ly', y + 'px'); };
  const drift = now => {
    if (!auto || !box.isConnected) return;
    const r = box.getBoundingClientRect(), s = (now - t0) / 1000;
    set(r.width * (.5 + .38 * Math.sin(s * .9)), r.height * (.5 + .3 * Math.sin(s * 1.7)));
    raf = requestAnimationFrame(drift);
  };
  raf = requestAnimationFrame(drift);
  const move = e => { auto = false; cancelAnimationFrame(raf); const r = box.getBoundingClientRect(); set(e.clientX - r.left, e.clientY - r.top); };
  box.addEventListener('pointermove', move); box.addEventListener('pointerdown', move);
  lightBtn.onclick = () => { box.classList.add('lit'); auto = false; lightBtn.disabled = true; lightBtn.innerHTML = icon('lantern') + ' Passage lit'; Sound.click(); };
}

/* =========================================================
   SCREENS
   ========================================================= */
function show(html) { main.innerHTML = html; window.scrollTo({top:0}); }
function setAct(act) { cur.act = act; }

function renderTitle() {
  cur.screen = 'title'; setAct(null); inHouse = false; Sound.ambience(false);
  $('#topbar').style.visibility = 'visible';
  const returning = !!S.name;
  show(`<section class="title-screen fade-in">
    ${eyeSVG('title-eye')}
    <h1 class="game-title"><span class="the">The</span>Tell-Tale <span class="heart-word">Heart</span></h1>
    <p class="kicker">An investigation in three acts · after Edgar Allan Poe, 1843</p>
    <p class="epigraph">“TRUE!—nervous—very, very dreadfully nervous I had been and am; but why will you say that I am mad?”</p>
    <p class="listen-hint" id="listenHint" ${Sound.running() || S.sound === 'off' ? 'hidden' : ''}>${icon('sound')} Click anywhere to hear his heart.</p>
    <form class="register" id="reg">
      <label for="nameIn">${returning ? 'Welcome back, officer' : 'Sign the police register'}</label>
      <input id="nameIn" maxlength="40" autocomplete="off" placeholder="Your name" value="${esc(S.name)}" required>
      <button class="btn btn-primary" type="submit">${returning ? 'Return to the house' : 'Enter the house'}</button>
      <p class="small muted">It is four o’clock in the morning. A neighbour heard a shriek during the night, and you have been sent to search the old man’s house.</p>
    </form>
  </section>`);
  $('#reg').onsubmit = e => {
    e.preventDefault();
    const n = $('#nameIn').value.trim();
    if (!n) { $('#nameIn').focus(); return; }
    S.name = n; save(); Sound.unlock(); Sound.creak(); unlock('register'); renderHub();
  };
}

function stageDone(id) { return !!(S.stages[id] && S.stages[id].done); }
function actProgress(act) { const st = ACTS[act].stages; return {done: st.filter(stageDone).length, total: st.length}; }
function finaleOpen() { return ['vocab','suspense','symbols'].every(a => actProgress(a).done === actProgress(a).total); }

function renderHub() {
  if (!S.name) return renderTitle();
  cur.screen = 'hub'; setAct(null); inHouse = true; Sound.ambience(true); beatLoop();
  const total = ALL_STAGES.length, done = ALL_STAGES.filter(stageDone).length;
  const nextUp = nextStage();
  const door = act => {
    const a = ACTS[act], p = actProgress(act), locked = act === 'finale' && !finaleOpen();
    const isDone = p.done === p.total;
    return `<button class="door ${locked ? 'locked' : ''} ${isDone ? 'done' : ''}" data-act="${act}" ${locked ? 'aria-disabled="true"' : ''}>
      <span class="door-icon">${icon(a.icon)}</span>
      <span class="act-no">Act ${a.num} · ${a.sub}</span>
      <h3>${a.title}</h3>
      <span class="small muted">${locked ? 'Locked. Finish all three acts to build your case.' : a.intro}</span>
      <span class="pips">${a.stages.map(s => `<span class="pip ${stageDone(s) ? 'on' : ''}"></span>`).join('')}</span>
      <span class="knob" aria-hidden="true"></span>
    </button>`;
  };
  show(`<section class="fade-in">
    <div class="hub-head"><div class="hub-text">
      <span class="kicker">Case No. 1843 · The old man’s house</span>
      <h2>Four o’clock, still dark as midnight</h2>
      <p class="muted" style="max-width:62ch">Officer ${esc(S.name)}, the narrator swears he is not mad. Search each room, gather your evidence, and decide for yourself. The heart above is <em>his</em>. Every wrong answer makes it race.</p>
      <div class="overall"><span>${done} of ${total} stages</span><span class="bar"><i style="width:${Math.round(done / total * 100)}%"></i></span></div>
      ${canSave ? '' : '<p class="save-warn">This browser is not saving progress (private browsing or blocked site data). Finish in one sitting, or ask your teacher about switching browsers.</p>'}
      ${nextUp ? `<button class="btn btn-primary continue-btn" id="continueBtn">${done || inProgress(nextUp) ? 'Continue' : 'Begin'}: ${STAGES[nextUp].name} →</button>` : ''}
    </div><div class="hub-eye" aria-hidden="true">${eyeSVG()}</div></div>
    <div class="doors">${['vocab','suspense','symbols','finale'].map(door).join('')}</div>
    <div class="hub-tools">
      <button class="btn" data-open="notebook">${icon('book').replace('<svg','<svg width="18" height="18"')} Notebook</button>
      <button class="btn" data-open="evidence">${icon('scroll').replace('<svg','<svg width="18" height="18"')} Evidence Locker (${S.evidence.length})</button>
      <button class="btn" data-open="shop">${icon('chest').replace('<svg','<svg width="18" height="18"')} The Old Man’s Chest</button>
      ${S.caseFile ? `<button class="btn" data-open="case">${icon('seal').replace('<svg','<svg width="18" height="18"')} View Case File</button>` : ''}
    </div>
  </section>`);
  $$('.door').forEach(d => d.onclick = () => {
    if (d.classList.contains('locked')) { toast('Finish the first three acts to unlock your case.', 'seal'); return; }
    Sound.creak();
    if (RM) return renderAct(d.dataset.act);
    d.classList.add('opening');
    setTimeout(() => { if (d.isConnected) renderAct(d.dataset.act); }, 380);
  });
  const cb = $('#continueBtn'); if (cb) cb.onclick = () => { Sound.creak(); nextUp === 'f-case' ? runFinale() : startStage(nextUp); };
  $$('[data-open]').forEach(b => b.onclick = () => ({notebook:openNotebook, evidence:openEvidence, shop:openShop, case:() => showCaseFile(true)})[b.dataset.open]());
}

/* The stage a returning student most likely wants: one left mid-round, else the first unfinished one. */
function nextStage() {
  const open = ['vocab','suspense','symbols'].flatMap(a => ACTS[a].stages.filter((id, i) => !stageDone(id) && (i === 0 || stageDone(ACTS[a].stages[i - 1]))));
  const mid = open.find(inProgress);
  if (mid) return mid;
  if (open.length) return open[0];
  return finaleOpen() && !S.caseFile ? 'f-case' : null;
}
function renderAct(act) {
  if (act === 'finale') return runFinale();
  cur.screen = 'act'; setAct(act);
  const a = ACTS[act];
  const items = a.stages.map((id, i) => {
    const st = STAGES[id], s = S.stages[id] || {}, unlocked = i === 0 || stageDone(a.stages[i - 1]);
    const meta = s.done ? (st.scored === false ? 'Done' : `Best ${s.best}/${s.total}`) : (!unlocked ? 'Locked' : inProgress(id) ? 'In progress' : 'Ready');
    return `<button class="stage-item ${s.done ? 'done' : ''}" data-stage="${id}" ${unlocked ? '' : 'disabled'}>
      <span class="num">${s.done ? '✓' : i + 1}</span>
      <span><h3>${st.name}</h3><span class="small muted">${st.desc}</span></span>
      <span class="meta">${s.done && st.scored !== false ? `<span class="stars">${stars(s.best, s.total)}</span><br>` : ''}${meta}</span>
    </button>`;
  }).join('');
  show(`<section class="room fade-in">
    <button class="btn-link" data-back>← Back to the house</button>
    <div class="act-head">
      <span class="act-mark" aria-hidden="true">${icon(a.icon)}</span>
      <span class="kicker">Act ${a.num} · ${a.sub}</span>
      <h2>${a.title}</h2>
      <p class="epigraph">“${a.epi}”</p>
      <p class="muted">${a.intro}</p>
    </div>
    <div class="stage-list">${items}</div>
  </section>`);
  $('[data-back]').onclick = renderHub;
  $$('[data-stage]').forEach(b => b.onclick = () => { Sound.click(); startStage(b.dataset.stage); });
}
function inProgress(id) {
  if (S.roundProg[id]) return true;
  if (id === 'v-study') return S.studySeen.length > 0;
  if (id === 's-tools') return S.toolsSeen.length > 0;
  return false;
}
function stars(score, total) { if (!total) return ''; const p = score / total; const n = p >= .9 ? 3 : p >= .7 ? 2 : 1; return '★'.repeat(n) + '☆'.repeat(3 - n); }

function frame(id, inner, progress) {
  const st = STAGES[id], a = ACTS[st.act];
  show(`<section class="room fade-in">
    <div class="stage-head">
      <button class="btn-link" data-back>← ${a.title}</button>
      <div class="grow"></div>
      <span class="progress-text" id="ptext">${progress || ''}</span>
    </div>
    <span class="kicker">Act ${a.num} · ${st.name}</span>
    <h2 style="margin:6px 0 14px">${st.name}</h2>
    <div class="progress-line"><i id="pline" style="width:0%"></i></div>
    <div id="stageBody">${inner || ''}</div>
  </section>`);
  $('[data-back]').onclick = () => { clearInterval(matchTimer); st.act === 'finale' ? renderHub() : renderAct(st.act); };
  return $('#stageBody');
}
function setProgress(i, n, label) {
  const p = $('#pline'); if (p) p.style.width = Math.round(i / n * 100) + '%';
  const t = $('#ptext'); if (t) t.textContent = label || `${Math.min(i + 1, n)} of ${n}`;
}

function startStage(id) {
  cur.screen = 'stage'; setAct(STAGES[id].act);
  try { stageRunner(id); }
  catch (e) {
    /* a damaged half-finished round: drop it and start the stage over rather than freeze */
    delete S.roundProg[id]; save();
    stageRunner(id);
  }
}
function stageRunner(id) {
  ({ 'v-study':runStudy, 'v-lantern':runLantern, 'v-match':runMatch, 'v-detect':() => runSequence(id, DETECT.map(q => ({...q, evidence:false}))),
     's-tools':runTools, 's-chimes':runChimes, 's-dial':runDial, 's-rewrite':runRewrite,
     'y-intro':runSymIntro, 'y-planks':runPlanks, 'y-deep':runDeep, 'y-bonus':() => runSequence(id, BONUS) })[id](id);
}

function completeStage(id, score, total, note, reviewIds) {
  const st = S.stages[id] || {plays:0};
  const firstTime = !st.done;
  st.done = true; st.plays = (st.plays || 0) + 1; st.at = Date.now();
  delete S.roundProg[id];
  if (score != null) { st.last = score; st.total = total; st.best = Math.max(st.best || 0, score); }
  S.stages[id] = st;
  if (firstTime) addGold(3);
  if (score != null && score === total && total > 0) unlock('steady');
  if (id === 's-chimes') unlock('twelve');
  const act = STAGES[id].act;
  if (act !== 'finale' && actProgress(act).done === actProgress(act).total) unlock({vocab:'sagacity', suspense:'eighth', symbols:'planks'}[act]);
  save();
  if (id === 'f-case') return;
  const stagesInAct = ACTS[act].stages, next = stagesInAct[stagesInAct.indexOf(id) + 1];
  const pct = score != null && total ? Math.round(score / total * 100) : null;
  const review = [...new Set((reviewIds || []).map(x => S.results[x]).filter(r => r && r.first === false).map(r => r.label))];
  const line = pct == null ? 'Well studied.' : pct >= 90 ? 'Your sagacity is remarkable.' : pct >= 70 ? 'A steady hand. Most of the truth is in view.' : 'The heart is still pounding. Review the explanations and try again.';
  setProgress(1, 1, 'Complete');
  $('#stageBody').innerHTML = `<div class="fade-in" style="display:grid;gap:16px;justify-items:start">
    ${pct != null ? `<div class="big-score"><span id="countUp">${RM ? score : 0}</span> / ${total}</div><div class="stars star-pop" style="font-size:1.6rem">${stars(score, total).split('').map((s, k) => `<span style="animation-delay:${.35 + k * .18}s">${s}</span>`).join('')}</div>` : ''}
    <p class="epigraph">${note || line}</p>
    ${review.length ? `<div class="review-box"><span class="kicker">Worth another look</span><p class="small muted">You missed these on the first try. Open the Notebook to review them, or try the stage again.</p><div class="review-chips">${review.map(l => `<span>${esc(l)}</span>`).join('')}</div></div>` : ''}
    ${firstTime ? '<p class="small muted">+3 gold for completing this stage.</p>' : ''}
    <div class="row">
      ${next ? `<button class="btn btn-primary" data-next>Next: ${STAGES[next].name} →</button>` : `<button class="btn btn-primary" data-hub>Return to the house →</button>`}
      ${STAGES[id].scored === false ? '' : '<button class="btn" data-retry>Try this stage again</button>'}
      <button class="btn-link" data-act>Back to Act ${ACTS[act].num}</button>
    </div></div>`;
  const cu = $('#countUp');
  if (cu && !RM && score) {
    const t0 = performance.now(), dur = 600 + score * 40;
    const tickUp = now => { const p = Math.min(1, (now - t0) / dur); cu.textContent = Math.round(score * (1 - Math.pow(1 - p, 3))); if (p < 1 && cu.isConnected) requestAnimationFrame(tickUp); };
    requestAnimationFrame(tickUp);
  }
  const nb = $('[data-next]'); if (nb) nb.onclick = () => startStage(next);
  const hb = $('[data-hub]'); if (hb) hb.onclick = renderHub;
  const rb = $('[data-retry]'); if (rb) rb.onclick = () => startStage(id);
  $('[data-act]').onclick = () => renderAct(act);
}

/* The break between Round 1 and Round 2 of a stage. Progress is already saved,
   so a student can stop here and pick up Round 2 another day. */
function intermission(id, {score, total, note, onContinue}) {

      <path class="flame inner" d="M23 13c2.6 4 3.6 6.2 3.6 8.4a3.6 3.6 0 0 1-7.2 0c0-2.2 1-4.4 3.6-8.4z" fill="#fff1c9"/>
      <line x1="23" y1="28" x2="23" y2="33" stroke="#222" stroke-width="1.6"/>
      <rect x="15" y="33" width="16" height="39" rx="2" fill="#e9dcc0"/>
      <path d="M15 37c3 2 5-1 7 1s3 7 5 3 4-3 4-3" fill="none" stroke="#cbb894" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="9" y="72" width="28" height="5" rx="2" fill="#6b4a2f"/>
    </svg>
    <div class="round-dots"><i class="on"></i><i></i><span>Round 1 of 2 complete</span></div>
    ${total ? `<div class="big-score">${score} / ${total}</div><div class="stars" style="font-size:1.4rem">${stars(score, total)}</div>` : ''}
    <p class="epigraph">${note || 'Half the night is gone. The rest still waits in the dark.'}</p>
    <p class="small muted">${calm ? 'The narrator’s pulse slows a little while you rest. ' : ''}Your progress is saved. You can stop here and come back for Round 2 later.</p>
    <div class="row"><button class="btn btn-primary" data-r2>Begin Round 2 →</button><button class="btn-link" data-later>Stop here for now</button></div>
  </div>`;
  Sound.chime();

  $('[data-r2]', body).focus({preventScroll:true});
}

/* Generic sequence of questions, split into two rounds when there are four or more.
   opts.pick draws a random subset; the drawn order is saved so Round 2 resumes exactly. */
function runSequence(id, pool, opts = {}) {
  const act = STAGES[id].act;
  const body = frame(id);
  const saved = S.roundProg[id];
  let qs, i = 0, score = 0;
  if (saved && saved.ids && saved.ids.every(x => pool.some(q => q.id === x))) {
    qs = saved.ids.map(x => pool.find(q => q.id === x)); i = saved.i || 0; score = saved.score || 0;
  } else {
    qs = opts.pick ? shuffle(pool).slice(0, opts.pick) : pool;
  }
  const half = qs.length >= 4 ? Math.ceil(qs.length / 2) : qs.length;
  const split = half < qs.length;
  let breakShown = i > half, roundOneScore = saved && saved.r1 != null ? saved.r1 : null;
  const persist = () => { S.roundProg[id] = {ids:qs.map(q => q.id), i, score, r1:roundOneScore}; save(); };
  const step = () => {
    if (i >= qs.length) return completeStage(id, score, qs.length, opts.endNote, qs.map(q => q.id));
    if (split && i === half && !breakShown) {
      breakShown = true;
      if (roundOneScore == null) { roundOneScore = score; persist(); }
      return intermission(id, {score:roundOneScore, total:half, note:opts.breakNote, onContinue:step});
    }
    const r2 = split && i >= half, k = r2 ? i - half : i, size = r2 ? qs.length - half : half;
    setProgress(i, qs.length, split ? `Round ${r2 ? 2 : 1} of 2 · ${k + 1} of ${size}` : `${i + 1} of ${qs.length}`);
    const host = document.createElement('div');
    body.innerHTML = opts.top ? opts.top(i) : '';
    body.appendChild(host);
    mcq(host, qs[i], act, first => { if (first) score++; if (opts.after) opts.after(i, first); i++; persist(); step(); });
  };
  step();
}

/* ---------- ACT I ---------- */
function runStudy(id) {

function runLantern(id) {
  const qs = VOCAB.map(w => {
    const same = shuffle(VOCAB.filter(x => x.w !== w.w && x.pos === w.pos));
    const other = shuffle(VOCAB.filter(x => x.w !== w.w && x.pos !== w.pos));
    const distract = same.concat(other).slice(0, 3);
    const cap = s => w.form[0] === w.form[0].toUpperCase() ? s[0].toUpperCase() + s.slice(1) : s;
    return {
      id:'lan-' + w.w, label:w.w, lantern:true, evidence:false, clueDef:w.def, cluePos:w.pos,
      passage: w.blank.replace('___', '<span class="blank">?</span>'),
      prompt:'Which word belongs in the blank?',
      options:[{t:cap(w.form), why:`Yes. “${w.form}” means <strong>${w.def}</strong>. ${w.clue}`}]
        .concat(distract.map(d => ({t:cap(d.form), why:`“${d.form}” means ${d.def}. That doesn’t fit here. Clue: ${w.clue}`}))),
      answer:0,
      onCorrect: host => {
        const b = $('.lantern-passage', host); b.classList.add('lit');
        const bl = $('.blank', b); if (bl) bl.textContent = w.form;
        const lb = $('[data-light]', host); if (lb) lb.disabled = true;
      }
    };
  });
  runSequence(id, qs, {pick:10, breakNote:'The lantern burns low. Trim the wick and go on.', endNote:'The lantern is closed. Every word is in its place.'});
}

let matchTimer = null;
function runMatch(id) {
  const saved = S.roundProg[id];
  const order = saved && saved.order ? saved.order.map(w => VOCAB.find(v => v.w === w)) : shuffle(VOCAB);
  const rounds = [order.slice(0, 8), order.slice(8, 16)];
  const body = frame(id);
  let r = saved ? saved.r : 0, firstRight = saved ? saved.firstRight : 0;
  const playRound = () => {
    if (r >= rounds.length) { clearInterval(matchTimer); return completeStage(id, firstRight, VOCAB.length, 'The ticking in the wall has stopped… for now.', VOCAB.map(v => 'match-' + v.w)); }
    const words = rounds[r], defs = shuffle(words), mistakes = {}, matched = new Set(), startRight = firstRight;
    let sel = null, secs = 0;
    setProgress(r, rounds.length, `Round ${r + 1} of 2`);
    body.innerHTML = `<div class="fade-in">
      <div class="match-top"><p class="muted">Tap a word, then its meaning. Wrong pairs make the heart race.</p>
        <div class="beetle-timer ticking" aria-live="off">${icon('beetle')}<span id="secs">0:00</span></div></div>
      <div class="match-grid">
        <div class="match-col">${shuffle(words).map(w => `<button class="mitem word" data-w="${w.w}">${w.w}</button>`).join('')}</div>
        <div class="match-col">${defs.map(w => `<button class="mitem def" data-d="${w.w}">${w.def}</button>`).join('')}</div>
      </div></div>`;
    clearInterval(matchTimer);
    matchTimer = setInterval(() => {
      if (!$('#secs')) return clearInterval(matchTimer);
      if ($('.modal-back') || $('.confession') || document.visibilityState !== 'visible') return;
      secs++; $('#secs').textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
      if (secs % 2 === 0) Sound.tick();
    }, 1000);
    const all = $$('.mitem', body);
    all.forEach(b => b.onclick = () => {
      if (b.classList.contains('matched')) return;
      const side = b.dataset.w ? 'w' : 'd', key = b.dataset.w || b.dataset.d;
      if (!sel || sel.side === side) { all.forEach(x => x.classList.remove('sel')); sel = {side, key, el:b}; b.classList.add('sel'); Sound.click(); return; }
      const wKey = side === 'w' ? key : sel.key, dKey = side === 'd' ? key : sel.key;
      if (wKey === dKey) {
        [b, sel.el].forEach(x => { x.classList.remove('sel'); x.classList.add('matched'); x.disabled = true; });
        matched.add(wKey);
        const w = VOCAB.find(v => v.w === wKey), ok = !mistakes[wKey];
        record('match-' + wKey, 'vocab', wKey, ok, b);
        if (ok) { firstRight++; heartRight(); }
        Sound.good();
        sel = null;
        if (matched.size === words.length) {
          clearInterval(matchTimer);
          if (secs <= 45) unlock('acute');
          if (r === 0) {
            S.roundProg[id] = {order:order.map(w => w.w), r:1, firstRight}; save();
            setTimeout(() => intermission(id, {score:firstRight - startRight, total:words.length,
              note:`Round 1 matched in ${secs} seconds. The beetle in the wall is still ticking…`, onContinue:() => { r = 1; playRound(); }}), 700);
          } else {
            body.insertAdjacentHTML('beforeend', `<div class="fb good fade-in" style="margin-top:16px"><div class="fb-title">Round 2 complete in ${secs} seconds.</div>
              <div><button class="btn btn-primary" id="nextRound">Finish →</button></div></div>`);
            $('#nextRound').onclick = () => { r++; playRound(); };
            $('#nextRound').focus();
          }
        }
      } else {
        mistakes[wKey] = (mistakes[wKey] || 0) + 1;
        [b, sel.el].forEach(x => { x.classList.remove('sel', 'nope'); void x.offsetWidth; x.classList.add('nope'); });
        heartWrong(); Sound.bad(); sel = null;
      }
    });
  };
  playRound();
}
