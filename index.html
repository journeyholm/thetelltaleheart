function clockSVG(n) {
  const marks = Array.from({length:12}, (_, k) => {
    const a = (k + 1) * 30 * Math.PI / 180;
    const x1 = 60 + Math.sin(a) * 44, y1 = 60 - Math.cos(a) * 44, x2 = 60 + Math.sin(a) * 52, y2 = 60 - Math.cos(a) * 52;
    return `<line class="mark ${k < n ? 'lit' : ''}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }).join('');
  return `<svg class="clock" viewBox="0 0 120 120" aria-hidden="true"><circle class="face" cx="60" cy="60" r="56"/><circle cx="60" cy="60" r="56" fill="none" stroke="#3a2a20" stroke-width="4"/>${marks}
    <line class="hand" x1="60" y1="60" x2="60" y2="22" style="transform:rotate(${n * 30}deg)"/><line x1="60" y1="60" x2="60" y2="38" stroke="#1a110d" stroke-width="4" stroke-linecap="round" style="transform:rotate(${n * 30 - 90}deg);transform-origin:60px 60px"/><circle cx="60" cy="60" r="4" fill="#1a110d"/></svg>`;
}
function runChimes(id) {
  runSequence(id, CHIMES, {
    top: i => `<div class="clock-wrap">${clockSVG(i)}<div class="clock-text"><strong>Stroke ${i + 1} of twelve</strong>Answer correctly and the clock moves toward midnight.</div></div>`,
    after: () => Sound.chime(),
    breakNote:'The clock has struck six. Six strokes remain before midnight.',
    endNote:'The clock strikes twelve. “The old man’s hour had come!”'
  });
}

function runDial(id) {
  const body = frame(id);
  let r = 0, score = 0;
  const round = () => {
    if (r >= DIAL.length) return completeStage(id, score, DIAL.length, 'You can feel the tension rise. That is pacing.', DIAL.map(d => d.id));
    const d = DIAL[r], order = shuffle(d.items.map((t, i) => ({t, i})));
    const pos = {}; let next = 1, checked = false;
    setProgress(r, DIAL.length, `Round ${r + 1} of ${DIAL.length}`);
    body.innerHTML = `<div class="fade-in"><p class="prompt">Tap the passages in order, from <strong>calmest</strong> (1) to <strong>most frantic</strong> (4).</p>
      <div class="dial-scale"><span>calm</span><span>frantic</span></div>
      <div class="dial-list">${order.map((o, k) => `<button class="dial-item" data-k="${k}"><span class="slot"></span><span>“${o.t}”</span></button>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="btn btn-primary" id="check" disabled>Check my order</button><button class="btn-link" id="clear">Clear</button></div>
      <div class="feedback" aria-live="polite"></div></div>`;
    const items = $$('.dial-item', body);
    const paint = () => { items.forEach((b, k) => { const p = pos[k]; $('.slot', b).textContent = p || ''; b.classList.toggle('set', !!p); }); $('#check').disabled = Object.keys(pos).length < 4; };
    items.forEach((b, k) => b.onclick = () => {
      if (checked) return;
      if (pos[k]) { const removed = pos[k]; delete pos[k]; Object.keys(pos).forEach(j => { if (pos[j] > removed) pos[j]--; }); next--; }
      else if (next <= 4) { pos[k] = next++; }
      Sound.click(); paint();
    });
    $('#clear').onclick = () => { if (checked) return; Object.keys(pos).forEach(k => delete pos[k]); next = 1; paint(); };
    $('#check').onclick = () => {
      checked = true;
      const ok = order.every((o, k) => pos[k] === o.i + 1);
      record(d.id, 'suspense', d.label, ok, $('#check'));
      items.forEach((b, k) => { b.classList.add(pos[k] === order[k].i + 1 ? 'ok' : 'no'); $('.slot', b).textContent = order[k].i + 1; b.disabled = true; });
      if (ok) { score++; heartRight(); Sound.good(); } else { heartWrong(); Sound.bad(); }
      $('.feedback', body).innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><div class="fb-title">${ok ? 'Perfectly paced.' : 'Here is the true order.'}</div><div>${d.why}</div>
        <div><button class="btn btn-primary" id="nextDial">Continue →</button></div></div>`;
      $('#check').disabled = true;
      $('#nextDial').onclick = () => { r++; round(); };
      $('#nextDial').focus();
    };
  };
  round();
}

    prompt:'Which rewrite builds more suspense, the way Poe would?'}));
  runSequence(id, qs, {breakNote:'Your pen is steady. Dip it in the ink again.', endNote:'You write like a man who hears all things in the heaven and in the earth.'});
}

    <div class="tools-grid">

const plankLabel = c => `${SYMBOLS.find(s => s.id === c.s).name}: “${c.q.split(/\s+/).slice(0, 6).join(' ')}…”`;
function runPlanks(id) {
  const body = frame(id);
  const saved = S.roundProg[id];
  const clues = saved && saved.ids ? saved.ids.map(x => PLANKS.find(p => p.id === x)) : shuffle(PLANKS);
  const solved = {}, missed = {};
  let score = saved ? saved.score : 0, active = null;
  if (saved) { (saved.solved || []).forEach(x => solved[x] = true); (saved.missed || []).forEach(x => missed[x] = true); }
  const persist = () => { S.roundProg[id] = {ids:clues.map(c => c.id), solved:Object.keys(solved), missed:Object.keys(missed), score}; save(); };
  const PER = 6;
  let round = clues.slice(0, PER).every(c => solved[c.id]) ? 1 : 0, justSolved = null;
  const counts = s => ({have: clues.filter(c => c.s === s && solved[c.id]).length, total: clues.filter(c => c.s === s).length});
  const draw = () => {
    const set = clues.slice(round * PER, round * PER + PER);
    const n = set.filter(c => solved[c.id]).length;
    setProgress(round * PER + n, clues.length, `Round ${round + 1} of 2 · ${n} of ${PER} clues`);
    body.innerHTML = `<div class="fade-in">
      <p class="muted" style="margin-bottom:12px">Something is hidden under every plank. Pry one up, read the clue, and decide which symbol it belongs to. Listen: the floor is beating.</p>
      <div class="sym-tray">${SYMBOLS.map(s => { const c = counts(s.id); return `<div class="sym-slot ${c.have === c.total ? 'full' : ''}">${icon(s.icon)}<span>${s.name}</span><b>${c.have}/${c.total}</b></div>`; }).join('')}</div>
      <div class="floor">${clues.map((c, i) => { const sym = SYMBOLS.find(s => s.id === c.s);
        if (i < round * PER || i >= round * PER + PER) return '';
        return solved[c.id]
          ? `<button class="plank solved ${c.id === justSolved ? 'just' : ''}" disabled aria-label="Plank ${i + 1}, solved: ${sym.name}"><span class="plank-label">${icon(sym.icon)} ${sym.name.replace('The ', '')}</span></button>`
          : `<button class="plank ${active === i ? 'active' : ''}" data-i="${i}" aria-label="Pry up plank ${i + 1}"><span class="nail l"></span><span class="nail r"></span><span class="plank-label">Plank ${i + 1}</span></button>`; }).join('')}</div>
      <div class="clue-panel" id="cp"></div></div>`;
    $$('.plank[data-i]', body).forEach(p => p.onclick = () => { active = +p.dataset.i; Sound.creak(); draw(); openClue(); });
    if (n === PER && round === 0) {
      const r1 = set.filter(c => !missed[c.id]).length;
      $('#cp').innerHTML = `<div class="fb good"><div class="fb-title">Six planks are up.</div><div>Six more are still nailed down.</div><div><button class="btn btn-primary" id="fin">Finish Round 1 →</button></div></div>`;
      $('#fin').onclick = () => intermission(id, {score:r1, total:PER, note:'Six planks are up. Something still beats beneath the other six.', onContinue:() => { round = 1; active = null; draw(); }});
    } else if (n === PER) {
      $('#cp').innerHTML = `<div class="fb good"><div class="fb-title">Every plank is up.</div><div>No human eye could have found all of that. You did.</div><div><button class="btn btn-primary" id="fin">Finish →</button></div></div>`;
      $('#fin').onclick = () => completeStage(id, score, clues.length, '“…tear up the planks! here, here!”', clues.map(c => c.id));
    }
  };
  const openClue = () => {
    const c = clues[active], cp = $('#cp');
    cp.innerHTML = `<div class="fade-in"><blockquote class="passage">“${c.q}”</blockquote><p class="prompt">Which symbol is this clue about?</p>
      <div class="sym-choices">${SYMBOLS.map(s => `<button class="sym-choice" data-s="${s.id}">${icon(s.icon)}<span>${s.name}</span></button>`).join('')}</div>
      <div class="feedback" aria-live="polite"></div></div>`;
    cp.scrollIntoView({behavior:'smooth', block:'nearest'});
    $$('.sym-choice', cp).forEach(b => b.onclick = () => {
      if (b.dataset.s === c.s) {
        const ok = !missed[c.id];
        record(c.id, 'symbols', plankLabel(c), ok, b);
        if (ok) { score++; heartRight(); }
        solved[c.id] = true; justSolved = c.id; persist(); Sound.good();
        fileEvidence(c.id, c.q, SYMBOLS.find(s => s.id === c.s).name);
        active = null; draw();
        $('#cp').insertAdjacentHTML('afterbegin', `<div class="fb good fade-in" style="margin-bottom:12px"><div class="fb-title">${SYMBOLS.find(s => s.id === c.s).name}</div><div>${c.why}</div></div>`);
      } else {
        if (!missed[c.id]) { missed[c.id] = true; persist(); record(c.id, 'symbols', plankLabel(c), false); }
        b.classList.add('wrong'); b.disabled = true; heartWrong(); Sound.bad();
        $('.feedback', cp).innerHTML = `<div class="fb bad"><div class="fb-title">Look again.</div><div>This clue isn’t about ${SYMBOLS.find(s => s.id === b.dataset.s).name.replace(/^The /, 'the ')}. Which object does the line actually describe? Find the key noun.</div></div>`;
      }
    });
  };
  draw();
}

function runDeep(id) {
  const secs = {eye:['eye','The Vulture Eye','“He had the eye of a vulture.”'], heart:['heart','The Heartbeat','“It is the beating of his hideous heart!”'], floor:['planks','The Floorboards','“I then took up three planks…”']};
  let last = null;
  const qs = DEEP.map(q => {
    const s = secs[q.sec], first = q.sec !== last; last = q.sec;
    return {...q, banner: first ? `<div class="section-banner"><span class="ico">${icon(s[0])}</span><div><span class="kicker">Symbol</span><h3>${s[1]}</h3><span class="small muted">${s[2]}</span></div></div>` : `<div class="section-banner" style="border:0;padding:0;margin-bottom:10px"><span class="ico" style="width:26px;height:26px">${icon(s[0])}</span><span class="kicker">${s[1]}</span></div>`};
  });
  runSequence(id, qs, {breakNote:'The eye has been examined, and the heart is beating beneath you. Listen closely before you go on.', endNote:'The eye that judges. The heart that tells. The floor that cannot hold the truth.'});
}

/* ---------- FINALE ---------- */
function runFinale() {
  cur.screen = 'stage'; setAct('finale');
  if (S.caseFile) return showCaseFile(false);
  const draft = S.caseDraft || {verdict:null, picks:[], claim:''};
  const pool = S.evidence.length >= 3 ? S.evidence : S.evidence.concat(CHIMES.filter(c => !S.evidence.some(e => e.id === c.id)).map(c => ({id:c.id, quote:c.passage, label:c.label})));
  const body = frame('f-case');
  let step = draft.verdict ? (draft.picks.length === 3 ? 3 : 2) : 1;
  const persist = () => { S.caseDraft = draft; save(); };
  const draw = () => {
    setProgress(step - 1, 3, `Step ${step} of 3`);
    if (step === 1) {
      body.innerHTML = `<div class="fade-in"><p class="prompt">Step 1 · Your verdict. Can the narrator be trusted?</p>
        <div class="choice-list">${VERDICTS.map(v => `<button class="choice" data-v="${v.id}" aria-pressed="${draft.verdict === v.id}"><span class="box">${draft.verdict === v.id ? '✓' : ''}</span><span>${v.t}</span></button>`).join('')}</div>
        <div class="feedback" id="vnote"></div>
        <div class="row" style="margin-top:16px"><button class="btn btn-primary" id="toEv" ${draft.verdict ? '' : 'disabled'}>Choose my evidence →</button></div></div>`;
      $$('[data-v]', body).forEach(b => b.onclick = () => { draft.verdict = b.dataset.v; persist(); Sound.click(); draw();
        if (draft.verdict === 'reliable') $('#vnote').innerHTML = '<div class="fb bad"><div class="fb-title">A bold position.</div><div>Most readers disagree, so your evidence will need to work hard. You may keep this verdict if you can defend it.</div></div>'; });
      $('#toEv').onclick = () => { step = 2; draw(); };
    } else if (step === 2) {
      body.innerHTML = `<div class="fade-in"><p class="prompt">Step 2 · Choose your <strong>three strongest</strong> pieces of evidence.</p>
        <p class="small muted" style="margin-bottom:12px">These come from your Evidence Locker: passages you analyzed correctly.</p>
        <div class="choice-list">${pool.map(e => { const on = draft.picks.includes(e.id); return `<button class="choice" data-e="${e.id}" aria-pressed="${on}"><span class="box">${on ? '✓' : ''}</span><span><span class="q">“${esc(e.quote)}”</span><span class="tag">${esc(e.label)}</span></span></button>`; }).join('')}</div>
        <div class="row" style="margin-top:16px;position:sticky;bottom:12px"><button class="btn" id="backV">← Verdict</button><button class="btn btn-primary" id="toClaim" ${draft.picks.length === 3 ? '' : 'disabled'}>Write my claim (${draft.picks.length}/3) →</button></div></div>`;
      $$('[data-e]', body).forEach(b => b.onclick = () => {
        const id = b.dataset.e, k = draft.picks.indexOf(id);
        if (k >= 0) draft.picks.splice(k, 1); else if (draft.picks.length < 3) draft.picks.push(id); else { toast('You already chose three. Remove one first.', 'scroll'); return; }
        persist(); Sound.click(); const y = window.scrollY; draw(); window.scrollTo({top:y});
      });
      $('#backV').onclick = () => { step = 1; draw(); };
      $('#toClaim').onclick = () => { step = 3; draw(); };
    } else {
      const v = VERDICTS.find(x => x.id === draft.verdict);
      const picks = draft.picks.map(id => pool.find(e => e.id === id)).filter(Boolean);
      body.innerHTML = `<div class="fade-in" style="display:grid;gap:14px"><p class="prompt" style="margin:0">Step 3 · Write your claim.</p>
        <p class="small muted">Your verdict: <strong>${v.t}</strong></p>
        <div>${picks.map(e => `<blockquote class="passage" style="margin-bottom:8px;font-size:1rem">“${esc(e.quote)}”</blockquote>`).join('')}</div>
        <p class="small muted">Use this frame if it helps: <em>The narrator is ____ because ____. For example, when he says “____,” this shows ____. The [eye / heartbeat / floorboards] also suggests ____.</em></p>
        <label class="sr" for="claim">Your claim</label>
        <textarea class="claim" id="claim" placeholder="The narrator is…">${esc(draft.claim)}</textarea>
        <div class="row"><span class="small muted" id="wc"></span></div>
        <div class="row"><button class="btn" id="backE">← Evidence</button><button class="btn btn-primary" id="seal" disabled>Seal the Case File</button></div></div>`;
      const ta = $('#claim'), wc = $('#wc'), sealBtn = $('#seal');
      const upd = () => { const n = wordCount(ta.value); wc.textContent = n < 25 ? `${n} words. Write at least 25 to seal the case.` : `${n} words. Ready to seal.`; sealBtn.disabled = n < 25; draft.claim = ta.value; persist(); };
      ta.oninput = upd; upd();
      $('#backE').onclick = () => { step = 2; draw(); };
      sealBtn.onclick = () => {
        S.caseFile = {verdict:draft.verdict, evidence:picks.map(e => ({quote:e.quote, label:e.label})), claim:draft.claim.trim(), at:Date.now()};
        S.time.finale = S.time.finale || 0;
        save(); completeStage('f-case', null, null); unlock('closed'); Sound.chime();
        showCaseFile(false);
      };
    }
  };
  draw();
}

let modalReturn = null;
function modal(title, html, cls = '') {
  const opener = document.activeElement;
  closeModal();
  modalReturn = opener;
  const back = document.createElement('div'); back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="x" aria-label="Close">×</button></div><div class="modal-body">${html}</div></div>`;
  document.body.appendChild(back);
  back.addEventListener('click', e => { if (e.target === back) closeModal(); });
  $('.x', back).onclick = closeModal;
  $('.x', back).focus();
  return $('.modal-body', back);
}
function closeModal() {
  const m = $('.modal-back'); if (!m) return;
  m.remove();
  if (modalReturn && modalReturn.isConnected) modalReturn.focus({preventScroll:true});
  modalReturn = null;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function actAccuracy(act) {
  const rs = Object.values(S.results).filter(r => r.act === act);
  const right = rs.filter(r => r.first).length;
  return {right, total:rs.length, pct: rs.length ? Math.round(right / rs.length * 100) : 0};
}
function missedList(act) {
  return [...new Set(Object.values(S.results).filter(r => r.act === act && r.first === false).map(r => r.label))];
}
function chip(pct, total) {
  if (!total) return '<span class="chip none">Not started</span>';
  return `<span class="chip ${pct >= 80 ? 'ok' : pct >= 60 ? 'mid' : 'low'}">${pct >= 80 ? 'Strong' : pct >= 60 ? 'Developing' : 'Needs support'}</span>`;
}
function reportHtml() {
  const done = ALL_STAGES.filter(stageDone).length, totalTime = Object.values(S.time).reduce((a, b) => a + b, 0);
  const all = Object.values(S.results), right = all.filter(r => r.first).length;
  const rows = ['vocab','suspense','symbols'].map(a => {
    const p = actProgress(a), acc = actAccuracy(a), miss = missedList(a);
    return `<tr><td><strong>Act ${ACTS[a].num}</strong><br>${ACTS[a].sub}</td><td class="num">${p.done}/${p.total}</td>
      <td class="num">${acc.total ? `${acc.pct}% <span style="color:#6a5a48">(${acc.right}/${acc.total})</span>` : '—'}<br>${chip(acc.pct, acc.total)}</td>
      <td class="num">${fmtTime(S.time[a])}</td>
      <td>${miss.length ? miss.map(esc).join(', ') : (acc.total ? '<span style="color:#2f6b28">Nothing missed</span>' : '—')}</td></tr>`;
  }).join('');
  const stageRows = ALL_STAGES.map(id => { const s = S.stages[id], st = STAGES[id];
    return `<tr><td>Act ${ACTS[st.act].num}</td><td>${st.name}</td><td>${s && s.done ? '✓ Done' : inProgress(id) ? 'In progress' : 'Not yet'}</td><td class="num">${s && s.done && s.total ? `${s.last}/${s.total} last · ${s.best}/${s.total} best` : (s && s.done ? '—' : '')}</td><td class="num">${s && s.plays ? s.plays : ''}</td></tr>`; }).join('');
  const c = S.caseFile, v = c && VERDICTS.find(x => x.id === c.verdict);
  return `<p class="kicker">Student progress · ${canSave ? 'saved in this browser' : 'NOT being saved: this browser blocks storage'}</p>
    <h3 style="font-size:1.8rem;margin-top:4px">${esc(S.name || 'No name entered yet')}</h3>
    <div class="tr-sum">
      <div class="tr-stat"><div class="n">${Math.round(done / ALL_STAGES.length * 100)}%</div><div class="l">Complete (${done}/${ALL_STAGES.length} stages)</div></div>
      <div class="tr-stat"><div class="n">${all.length ? Math.round(right / all.length * 100) + '%' : '—'}</div><div class="l">First-try accuracy</div></div>
      <div class="tr-stat"><div class="n">${fmtTime(totalTime)}</div><div class="l">Active time</div></div>
      <div class="tr-stat"><div class="n">${S.caseFile ? 'Sealed' : 'Not yet'}</div><div class="l">Final case file</div></div>
    </div>
    <p class="small muted">Started ${fmtDate(S.created)} · Last active ${fmtDate(S.lastActive)} · Heart “confessions” (many wrong answers in a row): ${S.confessions} · Lantern oil used: ${S.hintsUsed} · Vocabulary definition clues used: ${S.cluesUsed || 0} · Longest streak: ${S.bestStreak}</p>
    <div class="tr-sec"><h3>By act</h3><div class="tr-table-wrap"><table class="tr-table">
      <thead><tr><th>Act</th><th>Stages</th><th>First-try accuracy</th><th>Time</th><th>Missed on first try (review these)</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="tr-sec"><h3>Every stage</h3><div class="tr-table-wrap"><table class="tr-table">
      <thead><tr><th>Act</th><th>Stage</th><th>Status</th><th>Score</th><th>Plays</th></tr></thead><tbody>${stageRows}</tbody></table></div></div>
    <div class="tr-sec"><h3>Final case file</h3>
      ${c ? `<p><strong>Verdict:</strong> ${esc(v ? v.t : '')}</p><p style="margin-top:6px"><strong>Evidence chosen:</strong></p><ul style="margin:4px 0 8px 18px;padding:0">${c.evidence.map(e => `<li><em>“${esc(e.quote)}”</em> (${esc(e.label)})</li>`).join('')}</ul><p><strong>Written claim (${wordCount(c.claim)} words):</strong></p><p style="white-space:pre-wrap;font-family:var(--font-type);font-size:.95rem;margin-top:4px">${esc(c.claim)}</p>`
        : `<p class="muted">Not written yet.${S.caseDraft && S.caseDraft.claim ? ` A draft has been started (${wordCount(S.caseDraft.claim)} words).` : ''}</p>`}</div>`;
}
function reportText() {
  const lines = [`THE TELL-TALE HEART · Student progress`, `Student: ${S.name || '(no name)'}`, `Last active: ${fmtDate(S.lastActive)}`,
    `Stages complete: ${ALL_STAGES.filter(stageDone).length}/${ALL_STAGES.length}`, `Active time: ${fmtTime(Object.values(S.time).reduce((a, b) => a + b, 0))}`, ''];
  ['vocab','suspense','symbols'].forEach(a => { const acc = actAccuracy(a), p = actProgress(a), miss = missedList(a);
    lines.push(`Act ${ACTS[a].num} (${ACTS[a].sub}): ${p.done}/${p.total} stages, ${acc.total ? acc.pct + '% first-try (' + acc.right + '/' + acc.total + ')' : 'not started'}${miss.length ? '. Review: ' + miss.join(', ') : ''}`); });
  lines.push('');
  if (S.caseFile) { const v = VERDICTS.find(x => x.id === S.caseFile.verdict); lines.push(`Verdict: ${v ? v.t : ''}`, 'Evidence:', ...S.caseFile.evidence.map(e => `  "${e.quote}"`), 'Claim:', S.caseFile.claim); }
  else lines.push('Final case file: not written yet');
  return lines.join('\n');
}

  };

    try { localStorage.removeItem(KEY); } catch (err) {}
    S = fresh(); save(); closeModal(); updateHud(); renderTitle(); toast('Progress erased. Ready for the next student.', 'clipboard');
  };
}

$('#homeBtn').onclick = () => { closeModal(); clearInterval(matchTimer); S.name ? renderHub() : renderTitle(); };
$('#notebookBtn').onclick = openNotebook;
$('#evidenceBtn').onclick = openEvidence;
$('#shopBtn').onclick = openShop;
$('#awardsBtn').onclick = openAwards;
$('#teacherBtn').onclick = openTeacher;
$('#soundBtn').onclick = () => {
  S.sound = {on:'quiet', quiet:'off', off:'on'}[S.sound] || 'on'; save(); updateHud();
  Sound.ambience(false); if (S.sound !== 'off' && inHouse) { Sound.unlock(); Sound.ambience(true); }
  toast({on:'Sound on, with heartbeat.', quiet:'Sound on, heartbeat off.', off:'All sound muted.'}[S.sound], S.sound === 'off' ? 'mute' : 'sound');
};

// Active time: counts only while this tab is visible and the student has interacted in the last 90 seconds.
let lastInput = Date.now();
['pointerdown','keydown','scroll'].forEach(ev => window.addEventListener(ev, () => { lastInput = Date.now(); }, {passive:true}));
setInterval(() => {
  if (!cur.act || document.visibilityState !== 'visible' || Date.now() - lastInput > 90000) return;
  S.time[cur.act] = (S.time[cur.act] || 0) + 5; save();
}, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') beatLoop(); });

/* Heartbeat trace beside the heart: scrolls at the narrator's current pulse. */
(() => {
  const c = document.createElement('canvas');
  c.className = 'ecg'; c.width = 128; c.height = 48; c.setAttribute('aria-hidden', 'true');
  $('#heartIco').after(c);
  const g = c.getContext('2d'), pts = new Array(64).fill(0);
  let phase = 0, last = performance.now(), color = '#d23a2e', colorAt = 0;
  const shape = p => p < .04 ? -.12 : p < .08 ? 1 : p < .12 ? -.42 : (p > .3 && p < .42) ? .2 * Math.sin((p - .3) / .12 * Math.PI) : 0;
  const draw = () => {
    g.clearRect(0, 0, 128, 48);
    g.strokeStyle = color; g.lineWidth = 2.4; g.lineJoin = 'round'; g.shadowColor = color; g.shadowBlur = 6;
    g.beginPath(); pts.forEach((v, i) => { const x = i * 2, y = 30 - v * 22; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
  };
  if (RM) { for (let i = 0; i < 64; i++) pts[i] = shape((i / 40) % 1); draw(); return; }
  const frame = now => {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (document.visibilityState === 'visible' && c.offsetParent) {
      if (now - colorAt > 1000) { color = getComputedStyle(document.documentElement).getPropertyValue('--blood-hi').trim() || color; colorAt = now; }
      phase += dt * S.bpm / 60; pts.shift(); pts.push(shape(phase % 1)); draw();
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();

/* Dust drifting through the candlelight. Light enough for school Chromebooks: ~40 motes at 30 fps. */
(() => {
  if (RM) return;
  const c = document.createElement('canvas'); c.id = 'dust'; c.setAttribute('aria-hidden', 'true');
  $('.bg-candle').after(c);
  const g = c.getContext('2d'); let w, h, dpr;
  const resize = () => { dpr = Math.min(1.5, window.devicePixelRatio || 1); w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); };
  resize(); window.addEventListener('resize', resize);
  const motes = Array.from({length:40}, () => ({x:Math.random(), y:Math.random(), r:.6 + Math.random() * 1.6, vx:(Math.random() - .5) * .006, vy:-(.004 + Math.random() * .01), tw:Math.random() * 6.28}));
  let last = 0;
  const frame = now => {
    requestAnimationFrame(frame);
    if (now - last < 33 || document.visibilityState !== 'visible') return;
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    g.clearRect(0, 0, w, h);
    for (const m of motes) {
      m.x += m.vx * dt * 6; m.y += m.vy * dt * 6; m.tw += dt * 1.5;
      if (m.y < -.02) { m.y = 1.02; m.x = Math.random(); }
      if (m.x < -.02) m.x = 1.02; else if (m.x > 1.02) m.x = -.02;
      const dx = m.x - .5, dy = m.y - .2, light = Math.max(0, 1 - Math.hypot(dx * 1.4, dy * 1.8));
      const a = (.08 + light * .45) * (.6 + .4 * Math.sin(m.tw));
      g.fillStyle = `rgba(240,200,130,${a.toFixed(3)})`;
      g.beginPath(); g.arc(m.x * w, m.y * h, m.r, 0, 6.283); g.fill();
    }
  };
  requestAnimationFrame(frame);
})();

save();
try { updateHud(); S.name ? renderHub() : renderTitle(); }
catch (e) {
  main.innerHTML = `<section class="room"><h2>The house is in disarray</h2><p class="muted" style="margin:10px 0 16px">This browser’s saved game could not be opened. Starting fresh will erase it.</p><button class="btn btn-primary" id="fixSave">Start fresh</button></section>`;
  $('#fixSave').onclick = () => { try { localStorage.removeItem(KEY); } catch (err) {} location.reload(); };
}
beatLoop();
})();
</script>
</body>
</html>
